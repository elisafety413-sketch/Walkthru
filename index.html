<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Walk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Salco Job Walk</title>
<style>
:root{--ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--bg:#f4f5f7;--card:#ffffff;--card2:#eceef2;--line:#d8dce3;--tx:#0f1216;--mut:#5f6b7a;--ac:#0f1216;--onac:#fff;--acd:color-mix(in srgb,var(--ac) 62%,#000)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:radial-gradient(120% 55% at 50% 0%,color-mix(in srgb,var(--ac) 13%,transparent),transparent 65%),var(--bg);background-attachment:fixed}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:640px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:#fff;color:#0f1216;border-bottom:3px solid var(--ac)}
.ver{font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;padding:7px 9px;border:1.5px solid #0b0d10;border-radius:7px;letter-spacing:.04em;min-width:48px;text-align:center}
.logo-sm{height:46px;margin:0 auto;display:block}
.homebtn{width:48px;min-height:34px;border:0;background:transparent;color:#0b0d10;font:700 12px/1 var(--ff);letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:0}
.homebtn.hide{visibility:hidden}
.stepwrap{padding:14px 16px 4px}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.segs i.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px currentColor}
.lblrow{display:flex;align-items:center;gap:10px;margin-top:10px}.lblrow .lbl{margin-top:0;flex:1}
.pill{font:800 11px/1 var(--ff);letter-spacing:.05em;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);white-space:nowrap}
.pill.ok{color:#15803d;border-color:#86efac}.pill.warn{color:#b45309;border-color:#fcd34d}.pill.err{color:#b91c1c;border-color:#fca5a5}
.linkbtn{background:none;border:0;color:var(--tx);text-decoration:underline;font:inherit;padding:0}
.lbl{margin-top:10px;font:800 13px/1 var(--ff);letter-spacing:.14em;text-transform:uppercase;color:var(--acd);display:flex;align-items:center;gap:8px}
.lbl b{width:10px;height:10px;border-radius:50%;background:var(--ac);display:inline-block}
main{flex:1;padding:12px 16px 230px}
h1{font-size:26px;line-height:1.15;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin:20px 0 8px;font-weight:700}
.hint{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.plate{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:16px}
.plate img{height:150px}
foot,footer{display:block}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
#foot .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.nav .btn.sec{flex:0 0 32%}
.btn{min-height:56px;border-radius:14px;border:0;font:800 16px/1 var(--ff);letter-spacing:.02em;background:var(--ac);color:var(--onac);padding:0 18px;width:100%;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#b91c1c;border:1px solid #fca5a5;min-height:40px;font-size:13px}
.btn:disabled{opacity:.3}
.btn.sm{min-height:40px;font-size:13px;width:auto;padding:0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:64px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);color:var(--tx);font:600 16px/1.2 var(--ff);text-align:left;cursor:pointer}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,var(--card))}
.opt.full{grid-column:1/-1}
.opt small{display:block;color:var(--mut);font-weight:500;margin-top:3px;font-size:12px}
.flagopt{display:flex;align-items:center;gap:14px;min-height:72px;font-size:18px;font-weight:800;width:100%;margin-bottom:10px;border-left-width:8px}
.inp{width:100%;min-height:54px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--tx);padding:12px 14px;font:16px/1.3 var(--ff);margin-top:10px;display:block}
.inp:focus{outline:none;border-color:var(--ac)}
textarea.inp{min-height:90px;resize:vertical}
.lblin{font-size:13px;color:var(--mut);margin:16px 0 0;font-weight:600}
.cam{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:300px;border:2.5px dashed var(--ac);border-radius:20px;color:var(--acd);font-weight:800;font-size:20px;background:color-mix(in srgb,var(--ac) 8%,transparent);cursor:pointer}
.cam svg{width:64px;height:64px}
.prev{border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line)}
.prev img{display:block;width:100%;max-height:52vh;object-fit:contain}
.retake{display:block;text-align:center;margin-top:12px;color:var(--acd);font-weight:800;padding:12px;border:1.5px solid var(--ac);border-radius:12px;cursor:pointer}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center;margin-bottom:10px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px}
.row .t span{color:var(--mut);font-size:13px}
.thumb{width:68px;height:68px;border-radius:10px;object-fit:cover;background:#000;flex:none}
.badge{display:inline-block;font:800 11px/1 var(--ff);letter-spacing:.04em;padding:4px 8px;border-radius:999px;margin:4px 6px 0 0;text-transform:uppercase}
.badge.sv{background:#e5e7eb;color:#0b0d10}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .opt{min-height:56px;text-align:center;font-size:14px}
.num{font:800 12px/1 ui-monospace,Menlo,monospace;color:var(--mut)}
.area-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.1em}
.area-h:after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.walkcard{margin-bottom:10px}
.walkcard .a{font-weight:800;font-size:17px}
.walkcard .m{color:var(--mut);font-size:13px;margin-top:4px}
.stat{color:var(--mut);font-size:13px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#0f1216;color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;font-weight:800;font-size:18px;color:#fff}
#busy.on{display:flex}

button.retake{background:transparent;font:800 16px/1.4 var(--ff);color:var(--acd)}
.retakerow{display:flex;gap:10px;margin-top:12px}.retakerow .retake{flex:1;margin:0}
#mk{position:fixed;inset:0;z-index:40;background:#0b0d10;display:none;flex-direction:column}
#mk.on{display:flex}
.mkbar{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#15181d;flex-wrap:wrap}
.mkbar button{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid #3a414c;background:#232830;color:#fff;font:800 14px/1 var(--ff)}
.mkbar button.sel{border-color:#22d3ee}
.mkbar .sw{width:44px;padding:0;border-radius:50%;border:3px solid #3a414c}.mkbar .sw.sel{border-color:#22d3ee}
.mkcv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.mkcv canvas{max-width:100%;max-height:100%;touch-action:none;background:#000}
.mkfoot{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#15181d}
.mkfoot .btn{flex:1}.mkfoot .btn.sec{flex:0 0 32%}
.unit-h{margin:26px 0 4px;padding:10px 14px;background:#0ea5e9;color:#0b0d10;font-weight:800;font-size:17px;border-radius:10px}
.runit{margin:26px 0 4px;padding:10px 14px;background:#0f4c75;color:#fff;font-weight:800;font-size:18px;letter-spacing:.04em;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-before:page}
.cov{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font:700 13px/1 var(--ff);color:var(--tx)}
.cov.ok{border-color:#22c55e;color:#15803d;background:#f0fdf4}.cov.no{border-color:#9ca3af;color:#6b7280;text-decoration:line-through}
.covg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cov-d summary{cursor:pointer;font-size:15px}
.xrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.xt{position:relative}.xt img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#000;display:block}
.xt button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#b91c1c;color:#fff;font:800 14px/1 var(--ff)}
.chipbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font:700 13px/1 var(--ff);color:var(--tx);margin:0 6px 8px 0}
.chipbtn.sel{border-color:#14b8a6;background:#f0fdfa;color:#0f766e}
.rtext{white-space:pre-wrap;font-size:13px}
.phw{width:62mm;flex:none}.phw .ph{width:100%}.xph{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.xph img{width:19mm;height:14mm;object-fit:cover;border:1px solid #ccc}
.rsent{margin:6px 0 0;padding-left:20px;font-size:13px}.rsent li{margin:3px 0}
/* ---------- REPORT (white, printable) ---------- */
body.reporting{background:#fff}
body.reporting #app,body.reporting #foot,body.reporting #toast{display:none!important}
body:not(.reporting) #report{display:none}
#report{background:#fff;color:#111;font:14px/1.4 Arial,Helvetica,sans-serif;max-width:900px;margin:0 auto;padding:0 18px 40px}
.rtool{position:sticky;top:0;background:#111;color:#fff;margin:0 -18px 18px;padding:12px 18px;display:flex;gap:10px;align-items:center;z-index:5}
.rtool button{font:700 14px/1 Arial;padding:12px 16px;border-radius:8px;border:0;cursor:pointer}
.rtool .go{background:#fff;color:#111;margin-left:auto}
.rtool .bk{background:#333;color:#fff}
.rtool small{color:#bbb;font-size:12px}
.rhead{display:flex;gap:18px;align-items:center;border-bottom:3px solid #111;padding-bottom:14px;margin-bottom:14px}
.rhead img{height:96px}
.rhead h1{font-size:24px;margin:0 0 4px;color:#111;letter-spacing:0}
.rhead .sub{color:#555;font-size:13px}
.rmeta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 24px;margin-bottom:16px}
.rmeta div{font-size:13px}.rmeta b{display:inline-block;min-width:92px;color:#555;font-weight:700}
.rsec{margin:18px 0 8px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #ccc;padding-bottom:4px}
.rbox{border:2px solid #b91c1c;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.rbox.ok{border-color:#16a34a}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab td,.rtab th{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left}
.rtab th{font-size:11px;text-transform:uppercase;color:#555}
.rcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rcols h4{margin:0 0 4px;font-size:13px}
.rcols ul{margin:0;padding-left:18px;font-size:13px}
.rarea{margin:22px 0 8px;padding:6px 10px;background:#111;color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:13px;break-after:avoid}
.ritem{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #ddd;break-inside:avoid}
.ritem .ph{width:62mm;height:46mm;flex:none;background:#eee;border:1px solid #ccc;display:flex;align-items:center;justify-content:center}
.ritem .ph img{max-width:100%;max-height:100%;object-fit:contain}
.ritem .tx{flex:1}
.ritem .n{font-weight:800;color:#555;font-size:12px}
.ritem .mat{font-size:16px;font-weight:800;margin:2px 0}
.ritem .ext{font-size:14px;margin-bottom:4px}
.rb{display:inline-block;font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;margin-right:6px;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rnote{margin-top:6px;font-size:13px;color:#222;white-space:pre-wrap}
.rfoot{margin-top:24px;color:#777;font-size:11px;border-top:1px solid #ccc;padding-top:8px}
@media print{
  @page{size:Letter;margin:12mm}
  html,body{background:#fff!important}
  .rtool{display:none!important}
  #report{max-width:none;padding:0}
  .rarea,.rhead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.ovrow{display:flex;gap:12px;align-items:center;margin:0 0 10px}.ovrow img{width:96px;height:72px;object-fit:cover;border-radius:10px;background:#000;display:block}
.ovt{display:flex;flex:1;gap:8px;flex-wrap:wrap;align-items:center}.ovt b{width:100%;font-size:13px}
.retake.sm2{margin:0;padding:8px 12px;font-size:14px;flex:1}
.rfloor{margin:26px 0 4px;padding:8px 12px;background:#0f4c75;color:#fff;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid}
.rov{margin:6px 0 10px;break-inside:avoid}.rov img{width:300px;max-width:100%;border-radius:6px;display:block}.rovl{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="ver" id="ver"></span>
    <img class="logo-sm" id="logosm" alt="Salco Group">
    <button class="homebtn" id="homebtn" data-a="home">Home</button>
  </header>
  <div class="stepwrap"><div class="segs" id="segs"></div><div class="lblrow"><div class="lbl" id="lbl"></div><button class="pill" id="syncpill" data-a="syncNow" style="display:none"></button></div></div>
  <main id="main"></main>
</div>
<div id="foot"><div class="in" id="footin"></div></div>
<div id="report"></div>
<div id="toast"></div>
<div id="busy">Processing photo…</div>
<div id="mk"></div>

<script>

function scaled(src,max,q){return new Promise(res=>{

function areaFloor(a){a=a||'';

 if(m){const f=m[1];return f==='Basement'?{r:0,l:'Basement'}:f==='Main floor'?{r:1,l:'Main floor'}:f==='Upstairs'?{r:2,l:'Upstairs'}:{r:Number(m[2]),l:f.charAt(0).toUpperCase()+f.slice(1)};}

 if(b==='Basement')return{r:0,l:'Basement'};
 if(b==='Attic')return{r:80,l:'Attic'};
 if(b==='Roof')return{r:90,l:'Roof'};

function floorHead(gs,i){if(!hasFl(gs))return'';const g=gs[i],l=g.floor||'Floor not specified',p=gs[i-1];

  return{unit:u,groups,flat:groups.flatMap(g=>g.items.map(x=>({...x,area:g.area,unit:u})))};});

/* ---------- scope wording + totals ---------- */
const lc=s=>String(s||'').toLowerCase();
function phrase(it){
 const n=lc(it.material),e=it.extent||'';
 if(it.matId==='other')return(it.material||'Other')+(e?' - '+e:'');
 if(it.matId==='saw'||it.matId==='cdemo'){
  const verb=it.matId==='saw'?'Saw cut concrete floor':'Demolish concrete floor';
  const x=e.replace('(handheld)','(handheld equipment)').replace('(walk-behind)','(walk-behind equipment)');
  return verb+(x?', '+x.charAt(0).toLowerCase()+x.slice(1):'');
 }
 if(e==='2 ft'||e==='4 ft')return'Remove '+n+' up to '+e+' high';
 if(e==='Complete removal')return'Remove all '+n+' (complete removal)';
 if(e==='Partial')return'Partial removal of '+n;
 if(e==='Scrape')return'Scrape '+n;
 if(e==='Lift & remove')return'Lift and remove '+n;
 if(e==='Protect')return'Protect '+n+' in place';
 return'Remove '+n+(e&&e!=='Remove'?' - '+e:'');
}
function fullSentence(it){

const MK={img:null,shapes:[],cur:null,tool:'pen',color:'#ef4444',cv:null,ctx:null};
const MKCOL=['#ef4444','#facc15','#ffffff'];
function mkDraw(){
 const c=MK.ctx,cv=MK.cv;c.clearRect(0,0,cv.width,cv.height);c.drawImage(MK.img,0,0,cv.width,cv.height);
 const lw=Math.max(4,Math.round(Math.max(cv.width,cv.height)/170));
 c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
 [...MK.shapes,...(MK.cur?[MK.cur]:[])].forEach(s=>{
  c.strokeStyle=c.fillStyle=s.c;c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=lw;
  c.beginPath();
  if(s.t==='pen'){s.p.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(s.p.length===1)c.lineTo(s.p[0][0]+.1,s.p[0][1]);c.stroke();}
  else if(s.t==='circle'){const cx=(s.a[0]+s.b[0])/2,cy=(s.a[1]+s.b[1])/2,rx=Math.abs(s.b[0]-s.a[0])/2,ry=Math.abs(s.b[1]-s.a[1])/2;c.ellipse(cx,cy,Math.max(rx,2),Math.max(ry,2),0,0,Math.PI*2);c.stroke();}
  else if(s.t==='arrow'){
   const dx=s.b[0]-s.a[0],dy=s.b[1]-s.a[1],L=Math.hypot(dx,dy);if(L<4){return;}
   const ang=Math.atan2(dy,dx),hl=Math.min(L*.5,lw*6);
   c.moveTo(s.a[0],s.a[1]);c.lineTo(s.b[0],s.b[1]);c.stroke();
   c.beginPath();c.moveTo(s.b[0],s.b[1]);
   c.lineTo(s.b[0]-hl*Math.cos(ang-.45),s.b[1]-hl*Math.sin(ang-.45));
   c.lineTo(s.b[0]-hl*Math.cos(ang+.45),s.b[1]-hl*Math.sin(ang+.45));c.closePath();c.fill();}
  c.shadowBlur=0;
 });
}

}

  const b=await photoBlob(it.photoId,'full');if(!b){busy(false);toast('Photo not available');return;}
  MK.img=await loadBitmap(b);MK.shapes=[];MK.cur=null;MK.tool='pen';MK.color=MKCOL[0];
  $('#mk').innerHTML='<div class="mkbar"><button data-tool="pen">Pen</button><button data-tool="circle">Circle</button><button data-tool="arrow">Arrow</button>'+
   MKCOL.map(c=>'<button class="sw" data-col="'+c+'" style="background:'+c+'"></button>').join('')+'<button data-a="mkUndo">Undo</button></div>'+
   '<div class="mkcv"><canvas id="mkc"></canvas></div>'+
   '<div class="mkfoot"><button class="btn sec" data-a="mkCancel">Cancel</button><button class="btn" data-a="mkDone">Done</button></div>';
  const cv=$('#mkc');MK.cv=cv;cv.width=MK.img.width||MK.img.naturalWidth;cv.height=MK.img.height||MK.img.naturalHeight;MK.ctx=cv.getContext('2d');
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=mkPt(e);MK.cur=MK.tool==='pen'?{t:'pen',c:MK.color,p:[p]}:{t:MK.tool,c:MK.color,a:p,b:p};mkDraw();});
  cv.addEventListener('pointermove',e=>{if(!MK.cur)return;e.preventDefault();const p=mkPt(e);if(MK.cur.t==='pen')MK.cur.p.push(p);else MK.cur.b=p;mkDraw();});

function netErr(){const e=new Error('net');e.net=true;return e;}
async function authCall(grant,body){
 let r;try{r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});}catch(e){throw netErr();}
 const j=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||'auth');e.status=r.status;throw e;}
 return{access:j.access_token,refresh:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||'',uid:j.user&&j.user.id};
}
let refreshing=null;
function refreshSession(){
 if(refreshing)return refreshing;
 refreshing=(async()=>{try{const x=await authCall('refresh_token',{refresh_token:session.refresh});saveSession({...session,...x});}
  catch(e){if(!e.net){saveSession(null);if(state.view!=='login')go('login');}throw e;}
  finally{refreshing=null;}})();
 return refreshing;
}
async function sb(path,opts,retry=true){
 if(!session)throw new Error('nosession');
 if(session.exp-60<Date.now()/1000)await refreshSession();
 let r;try{r=await fetch(SB_URL+path,{...opts,headers:{apikey:SB_KEY,Authorization:'Bearer '+session.access,...((opts&&opts.headers)||{})}});}catch(e){throw netErr();}
 if(r.status===401&&retry){await refreshSession();return sb(path,opts,false);}
 return r;
}
const wRow=w=>({id:w.id,walk_date:w.created,address:w.address||null,lat:w.coords?w.coords.lat:null,lon:w.coords?w.coords.lon:null,job_no:w.jobNo||null,site_type:w.siteType,scope:w.scope||'Demolition',...(w.meta&&Object.keys(w.meta).length?{meta:w.meta}:{}),...(w.floors?{floors:w.floors}:{}),...(w.basement!=null?{basement:w.basement}:{})});
const iRow=(w,i)=>({id:i.id,walk_id:w.id,ts:i.ts,area:i.area,mat_id:i.matId||null,material:i.material,extent:i.extent||null,flag:i.flag,salvage:i.salvage||'none',salvage_note:i.salvageNote||null,note:i.note||null,photo_path:i.photoId+'.jpg',unit:i.unit||null,extra_photos:(i.extra&&i.extra.length)?i.extra.join(','):null});
const wFrom=r=>({id:r.id,created:Number(r.walk_date),address:r.address||'',coords:r.lat!=null?{lat:r.lat,lon:r.lon}:null,jobNo:r.job_no||'',siteType:r.site_type,floors:r.floors||null,basement:r.basement==null?null:r.basement,meta:r.meta||{},scope:r.scope||'Demolition'});
const iFrom=r=>{const p=String(r.photo_path||'').replace(/\.jpg$/,'');return{id:r.id,ts:Number(r.ts),area:r.area,matId:r.mat_id||'',material:r.material,extent:r.extent||'',flag:r.flag,salvage:r.salvage||'none',salvageNote:r.salvage_note||'',note:r.note||'',unit:r.unit||'',extra:r.extra_photos?String(r.extra_photos).split(',').filter(Boolean):[],extraUp:r.extra_photos?String(r.extra_photos).split(',').filter(Boolean):[],photoId:p,photoUp:p};};
const dirty=o=>!o.draft&&(o.srev===undefined||o.srev!==(o.rev||0));
const enqueue=e=>dbPut('outbox',{id:uid(),...e});
const photoUsed=id=>state.walks.some(w=>w.items.some(i=>i.photoId===id||(i.extra||[]).includes(id)));
async function delPhoto(id){if(!id||photoUsed(id))return;await tx('photos','readwrite',o=>o.delete(id));urlCache.delete(id+'full');urlCache.delete(id+'thumb');await enqueue({type:'photo',ref:id});}
const JSONH={'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'};

async function pushOutbox(){
 for(const e of await dbAll('outbox')){
  let r;
  if(e.type==='item')r=await sb('/rest/v1/items?id=eq.'+encodeURIComponent(e.ref),{method:'DELETE'});
  else if(e.type==='walk')r=await sb('/rest/v1/walks?id=eq.'+encodeURIComponent(e.ref),{method:'DELETE'});
  else r=await sb('/storage/v1/object/walk-photos',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:[e.ref+'.jpg',e.ref+'_t.jpg']})});
  if(!r.ok&&r.status!==404)throw await httpErr('delete '+e.type,r);
  await tx('outbox','readwrite',o=>o.delete(e.id));
 }
}
async function upload(path,blob){
 const r=await sb('/storage/v1/object/walk-photos/'+path,{method:'POST',headers:{'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
 if(!r.ok)throw await httpErr('upload',r);
}
async function pushWalks(){
 for(const w of [...state.walks]){
  const di=w.items.filter(dirty);
  if(!dirty(w)&&!di.length)continue;
  for(const oid of Object.values((w.meta&&w.meta.ov)||{})){if(!(w.ovUp||[]).includes(oid)){const rec=await dbGet('photos',oid);if(rec&&rec.full&&rec.thumb){await upload(oid+'.jpg',rec.full);await upload(oid+'_t.jpg',rec.thumb);}w.ovUp=[...(w.ovUp||[]),oid];}}
  const wr=w.rev||0;
  let r=await sb('/rest/v1/walks?on_conflict=id',{method:'POST',headers:JSONH,body:JSON.stringify(wRow(w))});
  if(!r.ok)throw await httpErr('walk',r);
  if((w.rev||0)===wr)w.srev=wr;
  const rows=[],marks=[];
  for(const it of di){
   if(it.photoUp!==it.photoId){
    const rec=await dbGet('photos',it.photoId);
    if(rec&&rec.full&&rec.thumb){await upload(it.photoId+'.jpg',rec.full);await upload(it.photoId+'_t.jpg',rec.thumb);}
    it.photoUp=it.photoId;
   }
   for(const x of (it.extra||[])){if(!(it.extraUp||[]).includes(x)){const rec=await dbGet('photos',x);if(rec&&rec.full&&rec.thumb){await upload(x+'.jpg',rec.full);await upload(x+'_t.jpg',rec.thumb);}it.extraUp=[...(it.extraUp||[]),x];}}
   rows.push(iRow(w,it));marks.push([it,it.rev||0]);
  }
  if(rows.length){
   r=await sb('/rest/v1/items?on_conflict=id',{method:'POST',headers:JSONH,body:JSON.stringify(rows)});
   if(!r.ok)throw await httpErr('items',r);
   marks.forEach(([it,rv])=>{if((it.rev||0)===rv)it.srev=rv;});
  }
  await dbPut('walks',w);
 }
}
async function fetchAll(path){
 let out=[],off=0;
 for(;;){
  const r=await sb(path+(path.includes('?')?'&':'?')+'limit=1000&offset='+off);
  if(!r.ok)throw await httpErr('pull',r);
  const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000;
 }
 return out;
}
async function dropWalkLocal(w){
 for(const i of w.items)for(const p of [i.photoId,...(i.extra||[])])await tx('photos','readwrite',o=>o.delete(p));
 for(const p of Object.values((w.meta&&w.meta.ov)||{}))await tx('photos','readwrite',o=>o.delete(p));
 await tx('walks','readwrite',o=>o.delete(w.id));
 state.walks=state.walks.filter(x=>x!==w);
}
async function pull(){
 const rw=await fetchAll('/rest/v1/walks?select=*&order=created_at.asc');
 const ri=await fetchAll('/rest/v1/items?select=*&order=ts.asc');
 const wid=new Set(rw.map(r=>r.id)),iid=new Set(ri.map(r=>r.id));
 let changed=false;
 for(const r of rw){
  const w=state.walks.find(x=>x.id===r.id),n=wFrom(r);
  if(!w){state.walks.push({...n,items:[],rev:0,srev:0});changed=true;}
  else if(!dirty(w)&&JSON.stringify([w.address,w.jobNo,w.siteType,w.coords,w.floors||null,w.basement==null?null:w.basement,JSON.stringify(w.meta||{})])!==JSON.stringify([n.address,n.jobNo,n.siteType,n.coords,n.floors,n.basement,JSON.stringify(n.meta||{})])){Object.assign(w,n);changed=true;}
 }
 for(const r of ri){
  const w=state.walks.find(x=>x.id===r.walk_id);if(!w)continue;
  const o=w.items.find(x=>x.id===r.id),n=iFrom(r);
  if(!o){w.items.push({...n,rev:0,srev:0});changed=true;}
  else if(!dirty(o)&&['area','matId','material','extent','flag','salvage','salvageNote','note','photoId'].some(k=>o[k]!==n[k])||(o.unit||'')!==n.unit||(o.extra||[]).join()!==n.extra.join()){Object.assign(o,n);changed=true;}
 }
 for(const w of [...state.walks]){
  if(!wid.has(w.id)){if(!dirty(w)&&!w.items.some(dirty)){await dropWalkLocal(w);changed=true;}continue;}
  const keep=w.items.filter(i=>iid.has(i.id)||i.draft||dirty(i));
  if(keep.length!==w.items.length){w.items=keep;changed=true;}
 }
 for(const w of state.walks)await dbPut('walks',w);
 if(state.walk&&!state.walks.includes(state.walk)){state.walk=null;if(['walk','review'].includes(state.view))go('home');}
 if(changed&&['home','walk','review'].includes(state.view))render();
}
let syncing=false,syncAgain=false,syncState='idle',syncT=null,syncErr='';
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,700);}
async function pendingCount(){let n=(await dbAll('outbox')).length;state.walks.forEach(w=>{if(dirty(w))n++;n+=w.items.filter(dirty).length;});return n;}
async function updatePill(){
 const p=$('#syncpill');if(!p)return;
 if(!session){p.style.display='none';return;}
 p.style.display='';const n=await pendingCount();let t,c='';
 if(syncing)t='Syncing…';
 else if(syncState==='error'){t='Sync problem · tap for details';c='err';}
 else if(!navigator.onLine||syncState==='offline'){t='Offline'+(n?' · '+n+' pending':'');c='warn';}
 else if(n){t=n+' pending';c='warn';}
 else{t='✓ Synced';c='ok';}
 p.textContent=t;p.className='pill '+c;
}
async function sync(){
 if(!session)return;
 if(syncing){syncAgain=true;return;}
 if(!navigator.onLine){syncState='offline';updatePill();return;}
 syncing=true;updatePill();
 try{await pushOutbox();await pushWalks();await pull();syncState='ok';}
 catch(e){syncState=e.net?'offline':'error';syncErr=String(e.message||e);console.warn('sync',e);}
 finally{syncing=false;updatePill();if(syncAgain){syncAgain=false;syncSoon();}}
}
window.addEventListener('online',()=>{syncState='idle';sync();});
window.addEventListener('offline',updatePill);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.view==='login')A.login();});

/* ---------- init ---------- */
(async function(){
 $('#ver').textContent=VERSION;$('#logosm').src=LOGO;
 try{await openDB();state.walks=await dbAll('walks');}catch(e){$('#main').innerHTML='<div class="card">Storage is unavailable in this browser. Private browsing can cause this.</div>';return;}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(!session)state.view='login';
 render();
 if(session)sync();
 setInterval(sync,60000);
})();
</script>
